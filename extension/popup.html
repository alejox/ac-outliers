<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>AC Outliers</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img src="icons/icon32.png" alt="" width="20" height="20" />
      <span class="name">AC Outliers</span>
      <span class="status" id="status" hidden><span class="status-dot"></span><span id="status-text"></span></span>
    </header>

    <form class="connect" id="connect" hidden>
      <p class="lead">Conecta la extensión con tu app para ver el score de cada video mientras navegas YouTube.</p>
      <label class="field">
        <span>Dirección de la app</span>
        <input id="app-url" type="url" required autocomplete="url" spellcheck="false" />
      </label>
      <label class="field">
        <span>Contraseña de la app</span>
        <input id="password" type="password" autocomplete="current-password" />
      </label>
      <p class="error" id="connect-error" role="alert" hidden></p>
      <button class="primary" type="submit" id="connect-button">Conectar</button>
      <a class="foot-link" href="https://acoutliers.alejoxcode.com/privacidad/" target="_blank" rel="noopener">Privacidad</a>
    </form>

    <section class="panel" id="panel" hidden>
      <label class="row toggle">
        <span class="row-text">
          <span class="row-title">Mostrar el score en YouTube</span>
          <span class="row-help">Encima de cada miniatura y bajo el título del video.</span>
        </span>
        <input type="checkbox" id="enabled" role="switch" />
      </label>

      <div class="row stacked">
        <span class="row-title" id="min-label">Mostrar desde</span>
        <div class="segmented" role="radiogroup" aria-labelledby="min-label" id="min-score">
          <button type="button" role="radio" data-value="0">Todos</button>
          <button type="button" role="radio" data-value="2">2×</button>
          <button type="button" role="radio" data-value="5">5×</button>
          <button type="button" role="radio" data-value="10">10×</button>
        </div>
      </div>

      <p class="meta" id="quota"></p>
      <p class="error" id="panel-error" role="alert" hidden></p>

      <div class="actions">
        <a class="secondary" id="open-app" target="_blank" rel="noopener">Abrir la app</a>
        <button class="ghost" type="button" id="disconnect">Desconectar</button>
      </div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
